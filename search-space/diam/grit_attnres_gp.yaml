method: bayes
metric:
  goal: minimize
  name: val_mae
gnn_type: GNN
parameters:
  conv_layer:
    values:
      - GRITAttnRes
  num_layers:
    values:
      - 24
      - 32
      - 40
      - 48
  hidden_dim:
    values:
      - 128
      - 192
      - 256
      - 320
  batch_size:
    values:
      - 128
  lr:
    distribution: loguniform
    min: 0.00020
    max: 0.00120
  weight_decay:
    distribution: loguniform
    min: 0.00010
    max: 0.00080
  dropout_prob:
    values:
      - 0.0
      - 0.05
      - 0.10
  grit_num_heads:
    values:
      - 2
      - 4
      - 8
  grit_attn_dropout:
    values:
      - 0.20
      - 0.35
      - 0.433
      - 0.50
  grit_act:
    values:
      - relu
initial_points:
  - {num_layers: 32, hidden_dim: 256, batch_size: 128, lr: 0.00082, weight_decay: 0.00032, dropout_prob: 0.0, grit_num_heads: 2, grit_attn_dropout: 0.433, grit_act: relu}
  - {num_layers: 40, hidden_dim: 256, batch_size: 128, lr: 0.00060, weight_decay: 0.00032, dropout_prob: 0.0, grit_num_heads: 4, grit_attn_dropout: 0.35, grit_act: relu}
  - {num_layers: 32, hidden_dim: 192, batch_size: 128, lr: 0.00082, weight_decay: 0.00032, dropout_prob: 0.05, grit_num_heads: 4, grit_attn_dropout: 0.433, grit_act: relu}
  - {num_layers: 48, hidden_dim: 320, batch_size: 128, lr: 0.00040, weight_decay: 0.00020, dropout_prob: 0.0, grit_num_heads: 8, grit_attn_dropout: 0.35, grit_act: relu}
