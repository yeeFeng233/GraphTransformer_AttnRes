method: bayes
metric:
  goal: minimize
  name: val_loss
gnn_type: GNN
parameters:
  conv_layer:
    values:
      - GPSAttnRes
  gps_attn_type:
    values:
      - multihead
  num_layers:
    values:
      - 26
      - 28
      - 30
  hidden_dim:
    values:
      - 160
      - 192
      - 224
  batch_size:
    values:
      - 512
  lr:
    distribution: loguniform
    min: 0.00003
    max: 0.00008
  weight_decay:
    distribution: loguniform
    min: 0.00010
    max: 0.00040
  dropout_prob:
    values:
      - 0.0
  gps_num_heads:
    values:
      - 4
  gps_attn_dropout:
    values:
      - 0.0
      - 0.1
  attnres_history_stride:
    values:
      - 2
      - 4
initial_points:
  - {num_layers: 26, hidden_dim: 192, batch_size: 512, lr: 0.00004, weight_decay: 0.00030, gps_num_heads: 4, gps_attn_dropout: 0.0, attnres_history_stride: 2}
  - {num_layers: 26, hidden_dim: 192, batch_size: 512, lr: 0.00004, weight_decay: 0.00030, gps_num_heads: 4, gps_attn_dropout: 0.0, attnres_history_stride: 4}
  - {num_layers: 28, hidden_dim: 192, batch_size: 512, lr: 0.00004, weight_decay: 0.00030, gps_num_heads: 4, gps_attn_dropout: 0.0, attnres_history_stride: 2}
  - {num_layers: 28, hidden_dim: 192, batch_size: 512, lr: 0.00004, weight_decay: 0.00030, gps_num_heads: 4, gps_attn_dropout: 0.0, attnres_history_stride: 4}
  - {num_layers: 26, hidden_dim: 224, batch_size: 512, lr: 0.00004, weight_decay: 0.00030, gps_num_heads: 4, gps_attn_dropout: 0.1, attnres_history_stride: 2}
  - {num_layers: 26, hidden_dim: 224, batch_size: 512, lr: 0.00004, weight_decay: 0.00030, gps_num_heads: 4, gps_attn_dropout: 0.1, attnres_history_stride: 4}
  - {num_layers: 30, hidden_dim: 192, batch_size: 512, lr: 0.00004, weight_decay: 0.00030, gps_num_heads: 4, gps_attn_dropout: 0.1, attnres_history_stride: 2}
  - {num_layers: 30, hidden_dim: 192, batch_size: 512, lr: 0.00004, weight_decay: 0.00030, gps_num_heads: 4, gps_attn_dropout: 0.1, attnres_history_stride: 4}
