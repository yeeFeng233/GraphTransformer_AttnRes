method: bayes
metric:
  goal: minimize
  name: val_mae
gnn_type: GNN
parameters:
  conv_layer:
    values:
      - GRITAttnRes
  num_layers:
    values:
      - 24
      - 28
      - 32
      - 36
  hidden_dim:
    values:
      - 96
      - 128
      - 160
  batch_size:
    values:
      - 128
      - 256
  lr:
    distribution: loguniform
    min: 0.00010
    max: 0.00080
  weight_decay:
    distribution: loguniform
    min: 0.00001
    max: 0.00100
  dropout_prob:
    values:
      - 0.0
      - 0.05
      - 0.10
  grit_num_heads:
    values:
      - 2
      - 4
  grit_attn_dropout:
    values:
      - 0.10
      - 0.20
      - 0.35
      - 0.45
  grit_act:
    values:
      - relu
  attnres_block_size:
    values:
      - 2
      - 4
      - 8
initial_points:
  - {num_layers: 32, hidden_dim: 128, batch_size: 128, lr: 0.00034, weight_decay: 0.00034, dropout_prob: 0.0, grit_num_heads: 2, grit_attn_dropout: 0.35, grit_act: relu, attnres_block_size: 8}
  - {num_layers: 32, hidden_dim: 128, batch_size: 128, lr: 0.00034, weight_decay: 0.00034, dropout_prob: 0.0, grit_num_heads: 2, grit_attn_dropout: 0.35, grit_act: relu, attnres_block_size: 2}
  - {num_layers: 32, hidden_dim: 128, batch_size: 128, lr: 0.00034, weight_decay: 0.00034, dropout_prob: 0.0, grit_num_heads: 2, grit_attn_dropout: 0.35, grit_act: relu, attnres_block_size: 4}

