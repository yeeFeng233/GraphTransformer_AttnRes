    values:
      - GRITAttnRes
  num_layers:
    values:
      - 17
      - 24
      - 32
      - 40
  hidden_dim:
    values:
      - 128
      - 160
      - 162
      - 192
      - 256
  batch_size:
    values:
      - 128
  lr:
    distribution: loguniform
    min: 0.00001
    max: 0.00080
  weight_decay:
