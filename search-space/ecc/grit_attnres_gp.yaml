  - {num_layers: 24, hidden_dim: 192, batch_size: 128, lr: 0.00025, weight_decay: 0.00008, dropout_prob: 0.0, grit_num_heads: 2, grit_attn_dropout: 0.05, grit_act: relu}
  - {num_layers: 32, hidden_dim: 256, batch_size: 128, lr: 0.00018, weight_decay: 0.00010, dropout_prob: 0.03, grit_num_heads: 2, grit_attn_dropout: 0.10, grit_act: relu}
